name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this first and publishes only if every row passes.
  workflow_call:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest and newest Python the MCP extra supports; the core still runs on 3.9.
        python: ["3.10", "3.14"]
        include:
          # 3.9 is end-of-life but is still the system python3 on macOS. ubuntu-latest is
          # Ubuntu 26.04, which setup-python has no 3.9 for.
          - os: ubuntu-24.04
            python: "3.9"
          - os: macos-latest
            python: "3.9"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Proves the dependencies resolve and install on this OS (pyobjc on macOS, Xlib on Linux).
      # The MCP extra needs Python 3.10+, so the 3.9 rows install and test without it.
      - name: Install
        run: |
          if [ "${{ matrix.python }}" = "3.9" ]; then
            python -m pip install -e ".[dev]"
          else
            python -m pip install -e ".[dev,mcp]"
          fi

      - name: Lint (syntax errors and undefined or unused names)
        run: ruff check --select E9,F .

      - name: Unit tests (headless) with coverage
        run: pytest -q --cov=ai_desktop --cov=ai_desktop_mcp --cov-report=term --cov-fail-under=80

      - name: CLI smoke test (no display needed)
        run: |
          ai-desktop --version
          ai-desktop --help
          ai-desktop mcp --help
          python -c "from PIL import Image; Image.new('RGB', (640, 400), (230, 230, 230)).save('s.png')"
          ai-desktop grid --input s.png -o g.png --spacing 50
          ai-desktop --json grid --input s.png | python -c "import json, sys; d = json.load(sys.stdin); assert d['ok'] and d['width'] == 640, d"
          ai-desktop --json log | python -c "import json, sys; d = json.load(sys.stdin); assert d['ok'] and d['count'] >= 1, d"
          ai-desktop screenshots dir
          ai-desktop screenshots clean --all

      # These need a desktop but no permissions, so they must pass on the mac/windows runners.
      - name: Monitors, windows and screenshots (live desktop)
        if: runner.os != 'Linux'
        run: |
          ai-desktop monitors
          ai-desktop --json monitors | python -c "import json, sys; d = json.load(sys.stdin); assert d['ok'] and d['count'] >= 1, d"
          ai-desktop windows
          ai-desktop --json windows | python -c "import json, sys; d = json.load(sys.stdin); assert d['ok'], d"
          ai-desktop --json screenshot --grid | python -c "import json, sys; d = json.load(sys.stdin); assert d['ok'] and d['width'] > 0, d"
          ai-desktop screenshot --monitor primary
          ai-desktop screenshots list
          ai-desktop log --limit 5

      # Informational: runners have no desktop (Linux) or no permissions (macOS), so some rows fail.
      - name: Doctor
        run: ai-desktop doctor
        continue-on-error: true

      # One X server for the whole sequence, so the move can be checked with position.
      - name: Live X11 test under Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb
          xvfb-run -a bash -euo pipefail -c '
            ai-desktop monitors
            ai-desktop windows
            ai-desktop --instant move --x 10 --y 10
            ai-desktop --json position | python -c "import json, sys; d = json.load(sys.stdin); assert (d[\"x\"], d[\"y\"]) == (10, 10), d"
            ai-desktop move --x 300 --y 200
            ai-desktop --json position | python -c "import json, sys; d = json.load(sys.stdin); assert (d[\"x\"], d[\"y\"]) == (300, 200), d"
            ai-desktop --json screenshot --grid | python -c "import json, sys; d = json.load(sys.stdin); assert d[\"ok\"] and d[\"width\"] > 0, d"
          '
