name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Proves the dependencies resolve and install on this OS (pyobjc on macOS, Xlib on Linux).
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Unit tests (headless)
        run: pytest -q

      - name: CLI smoke test (no display needed)
        run: |
          ai-desktop --version
          ai-desktop --help
          python -c "from PIL import Image; Image.new('RGB', (640, 400), (230, 230, 230)).save('s.png')"
          ai-desktop grid --input s.png -o g.png --spacing 50
          ai-desktop --json grid --input s.png | python -c "import json, sys; d = json.load(sys.stdin); assert d['ok'] and d['width'] == 640, d"
          ai-desktop screenshots dir
          ai-desktop screenshots clean --all

      # Informational: runners have no desktop (Linux) or no permissions (macOS), so some rows fail.
      - name: Doctor
        run: ai-desktop doctor
        continue-on-error: true

      - name: Live screenshot (macOS and Windows runners have a desktop)
        if: runner.os != 'Linux'
        run: |
          ai-desktop screenshot --grid
          ai-desktop screenshots list
        continue-on-error: true

      - name: Live X11 smoke test under Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb
          xvfb-run -a ai-desktop position
          xvfb-run -a ai-desktop move --x 10 --y 10
          xvfb-run -a ai-desktop screenshot --grid
        continue-on-error: true
