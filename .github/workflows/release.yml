name: Release to PyPI

# Runs when a version tag is pushed:  git tag v0.5.0 && git push --tags
# Publishing uses PyPI "trusted publishing" (OIDC), so no API token is stored anywhere.
# One-time setup is described in README.md under "Releasing".

on:
  push:
    tags: ["v*"]

jobs:
  # The whole CI matrix first: nothing is published unless every row passes.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches __version__ in ai_desktop.py
        run: grep -q "^__version__ = \"${GITHUB_REF_NAME#v}\"$" ai_desktop.py
      - run: python -m pip install build twine
      - run: python -m build
      - name: Check the package metadata
        run: python -m twine check --strict dist/*
      - name: Install the wheel in a clean venv and check its version
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          test "$(/tmp/wheel-check/bin/ai-desktop --version)" = "ai-desktop ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
