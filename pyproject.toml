[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-desktop"
dynamic = ["version"]
description = "CLI that lets any AI agent see the screen through a coordinate grid and control the mouse, keyboard and clipboard"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Kulka" }]
keywords = ["ai", "agent", "desktop", "automation", "screenshot", "pyautogui", "computer-use"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["pyautogui>=0.9.54", "pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "build"]
# The MCP server (`ai-desktop mcp`); the SDK needs Python 3.10+, the core stays on 3.9.
mcp = ["mcp>=2; python_version >= '3.10'"]
# Windows UI Automation for ui, click --ref/--name/--target, set-text and read.
windows = ["comtypes>=1.4; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/MichaelDKulka/ai-desktop"
Repository = "https://github.com/MichaelDKulka/ai-desktop"
Issues = "https://github.com/MichaelDKulka/ai-desktop/issues"
Changelog = "https://github.com/MichaelDKulka/ai-desktop/blob/main/CHANGELOG.md"

[project.scripts]
ai-desktop = "ai_desktop:main"

[tool.setuptools]
py-modules = ["ai_desktop", "ai_desktop_mcp", "ai_desktop_service", "ai_desktop_live", "ai_desktop_helper", "ai_desktop_ui", "ai_desktop_uia", "ai_desktop_vision"]

# The version lives in one place: __version__ in ai_desktop.py.
[tool.setuptools.dynamic]
version = { attr = "ai_desktop.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
